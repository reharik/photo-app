services:
  localstack:
    image: localstack/localstack:4.13
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=ses,sns,s3
      - DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      # Init hook: re-verifies the SES sender identity on every boot (state is
      # ephemeral and `make docker/dev/down` wipes the data volume).
      - ./infra/config/localstack/init/ready.d:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    ports:
      - "5432:5432"

  # Dev/CI images are source + tsx with no dist/, so the one-shot runs the
  # source entrypoint. Same contract as prod: run to completion, exit non-zero
  # on failure. This file is in BOTH the dev chain and the CI chain, which is
  # why the override lives here rather than in either leaf overlay.
  # env_file resolves from the repo root (every caller passes
  # --project-directory .).
  migrate:
    image: ${API_IMAGE:-${APP_NAME}-api:dev}
    working_dir: /app/apps/api
    command: ["npx", "tsx", "src/scripts/runMigrations.ts"]
    env_file:
      - ./apps/api/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

  api:
    image: ${API_IMAGE:-${APP_NAME}-api:dev}
    environment:
      NODE_ENV: development
      AWS_ENDPOINT: http://localstack:4566
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
    depends_on:
      localstack:
        condition: service_healthy

volumes:
  localstack_data:
