schema: ../../../apps/api/src/graphql/generated/schema.graphql
generates:
  ./src/enums/graphqlSmartEnums.ts:
    preset: '@reharik/graphql-codegen-smart-enum-preset'
    presetConfig:
      mode: enums
      serializeAs: value
      emitDescriptionsAsDisplay: true
      # Hand-authored in src/enums/ (deniedError, etc.). Their define<Name>Input
      # pins are emitted into graphqlSmartEnums.ts; enumRegistry goes to the
      # sibling graphqlSmartEnumsRegistry.ts so the module graph stays acyclic.
      externalEnums:
        Operation: './operation'
        AlbumMemberRole: './albumMemberRole'
        ReactionEmoji: './reactionEmojis'
        MediaItemStatus: './mediaItemStatus'
