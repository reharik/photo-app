# Production stack — the ONLY compose file used on the EC2 host.
#
# Deployed by .github/workflows/deploy.yml, which copies this file into the S3
# payload as `compose/docker-compose.yml`; remote-deploy.sh installs it to
# /opt/homeroll/compose/docker-compose.yml and runs it with an explicit
# `-f`. Explicit, never bare: a bare invocation would silently merge any
# docker-compose.override.yml sitting in that directory.
#
# Flat by design. This file replaces the former base.yml + prod.yml +
# workers.generated.yml chain; nothing is inherited and nothing is generated, so
# every value that reaches production is visible here.
#
# Interpolated at `up` time on the host (exported by remote-deploy.sh, which
# receives them through ssm-run.sh's allowlist):
#   API_IMAGE  - resolved per-deploy: `homeroll-api:${SHA}` when this deploy
#                loaded that image, else the running api container's image.
#   SHA        - the 12-char merge SHA.
# `homeroll` is written literally rather than as ${APP_NAME}: the generated
# worker overlay already baked it literally, and APP_NAME is fixed per repo.
services:
  db:
    image: postgres:16-alpine
    platform: linux/arm64
    restart: unless-stopped
    env_file:
      - /opt/homeroll/env/prod.env
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot migration runner. Migrations are a DEPLOY step, not a per-service
  # boot step: this runs them to completion and exits, and api/workers gate on
  # `service_completed_successfully`, so nothing can serve against an unmigrated
  # database. A non-zero exit here fails `compose up` / `compose run`, which is
  # what makes a failed migration abort a deploy loudly instead of silently
  # crash-looping the api.
  #
  # `restart` MUST stay "no". Every other service here is `unless-stopped`; a
  # one-shot carrying that policy would restart forever after exiting 0. This
  # used to be inherited from base.yml — now it is stated, so do not "tidy" it
  # into consistency with its neighbours.
  #
  # Targets the COMPILED entrypoint: the prod image is `runtime-node`, which
  # contains only apps/api/dist and has no source tree to tsx.
  migrate:
    image: ${API_IMAGE:-homeroll-api:latest}
    platform: linux/arm64
    restart: 'no'
    working_dir: /app/apps/api/dist
    command: ['node', 'scripts/runMigrations.js']
    env_file:
      - /opt/homeroll/env/prod.env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${API_IMAGE:-homeroll-api:latest}
    platform: linux/arm64
    restart: unless-stopped
    env_file:
      - /opt/homeroll/env/prod.env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
    # Loopback ONLY. Caddy terminates TLS on the host and reverse-proxies in;
    # dropping the 127.0.0.1 prefix would publish the api on every interface.
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3000}:${API_PORT:-3000}'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      # Boot is just-serve (migrations run in the `migrate` one-shot), so the
      # startup grace no longer has to cover migration time.
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Deliberately NO pinned-or-fallback logic like api's above: on a deploy where
  # the worker did not change, `homeroll-media-worker:${SHA}` does not exist on
  # the host. That is fine and must stay fine — the recreate loop only ever
  # `up`s services named in CHANGED_SERVICE_NAMES, and merely PARSING a service
  # never resolves its image. Giving this a `${WORKER_IMAGE}` with no default
  # would break every invocation, `run --rm migrate` included.
  #
  # No POSTGRES_HOST here: the worker takes it from prod.env, as it always has.
  media-worker:
    image: homeroll-media-worker:${SHA}
    platform: linux/arm64
    restart: unless-stopped
    env_file:
      - /opt/homeroll/env/prod.env
    environment:
      NODE_ENV: production
      POSTGRES_PORT: '${POSTGRES_PORT:-5432}'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata_prod:
