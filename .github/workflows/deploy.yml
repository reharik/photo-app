name: Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      deploy_backend:
        description: Deploy backend containers
        type: boolean
        default: true
      deploy_frontend:
        description: Deploy frontend
        type: boolean
        default: true
      force_full_backend:
        description: Build all backend images (ignore path-based skip)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false
  # cancel-in-progress: true

jobs:
  discover:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_backend || inputs.deploy_frontend }}
    runs-on: ubuntu-latest
    outputs:
      app_name: ${{ steps.discover.outputs.app_name }}
      aws_region: ${{ steps.discover.outputs.aws_region }}
      s3_bucket: ${{ steps.discover.outputs.s3_bucket }}
      env_name: ${{ steps.discover.outputs.env_name }}
      build_matrix: ${{ steps.discover.outputs.build_matrix }}
      changed_service_names: ${{ steps.discover.outputs.changed_service_names }}
      should_build_backend: ${{ steps.discover.outputs.should_build_backend }}
      should_deploy_backend: ${{ steps.discover.outputs.should_deploy_backend }}
      short_sha: ${{ steps.short_sha.outputs.short_sha }}
      frontend_changed: ${{ steps.discover.outputs.frontend_changed }}
    steps:
      - uses: actions/checkout@v4

      - id: short_sha
        name: Set short SHA
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - id: load_config
        shell: bash
        run: |
          set -euo pipefail
          chmod +x infra/scripts/deploy/load-infra-app-config.sh
          infra/scripts/deploy/load-infra-app-config.sh "infra.app.config.json" > /tmp/infra.env
          cat /tmp/infra.env
          set -a
          source /tmp/infra.env
          set +a

          {
            echo "APP_NAME=$APP_NAME"
            echo "ENV_NAME=$ENV_NAME"
            echo "AWS_REGION=$AWS_REGION"
            echo "S3_BUCKET=$S3_BUCKET"
            echo "DOCKER_APP_WORKSPACE_PATH=$DOCKER_APP_WORKSPACE_PATH"
            echo "DOCKER_WORKERS_JSON=$DOCKER_WORKERS_JSON"
            echo "DOCKER_NODE_VERSION=$DOCKER_NODE_VERSION"
          } >> "$GITHUB_ENV"

      - id: discover
        shell: bash
        run: |
          set -euo pipefail

          chmod +x infra/scripts/deploy/detect-changed-deploy-targets.sh
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${GITHUB_SHA}"
          FORCE_FULL_BACKEND="${{ github.event_name == 'workflow_dispatch' && inputs.force_full_backend }}"
          DEPLOY_BACKEND="${{ github.event_name != 'workflow_dispatch' || inputs.deploy_backend }}"
          DEPLOY_FRONTEND="${{ github.event_name != 'workflow_dispatch' || inputs.deploy_frontend }}"
          export BASE_SHA HEAD_SHA FORCE_FULL_BACKEND DEPLOY_BACKEND DEPLOY_FRONTEND
          export DOCKER_APP_WORKSPACE_PATH DOCKER_WORKERS_JSON

          eval "$(infra/scripts/deploy/detect-changed-deploy-targets.sh "infra.app.config.json")"

          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "aws_region=${AWS_REGION}" >> "$GITHUB_OUTPUT"
          echo "s3_bucket=${S3_BUCKET}" >> "$GITHUB_OUTPUT"
          echo "env_name=${ENV_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_matrix=${BUILD_MATRIX}" >> "$GITHUB_OUTPUT"
          echo "changed_service_names=${CHANGED_SERVICE_NAMES}" >> "$GITHUB_OUTPUT"
          echo "should_build_backend=${SHOULD_BUILD_BACKEND}" >> "$GITHUB_OUTPUT"
          echo "should_deploy_backend=${SHOULD_DEPLOY_BACKEND}" >> "$GITHUB_OUTPUT"
          echo "frontend_changed=${FRONTEND_CHANGED}" >> "$GITHUB_OUTPUT"

      - name: Generate worker compose overlay
        shell: bash
        run: |
          set -euo pipefail
          chmod +x infra/scripts/deploy/generate-prod-workers-compose.sh
          infra/scripts/deploy/generate-prod-workers-compose.sh "infra.app.config.json" "${SHORT_SHA}" > workers.generated.yml

      - uses: actions/upload-artifact@v4
        with:
          name: generated-worker-compose
          path: workers.generated.yml

  # Decide whether this merge can reuse the arm64 images the PR already built
  # and e2e-tested, instead of rebuilding them (~12min -> ~2min).
  #
  # Reuse requires ALL THREE to hold; any failure falls through to a normal
  # build. Reuse is an optimization and is never a hard dependency.
  #
  # That invariant covers the DECISION here AND the copy's EXECUTION in `reuse`:
  # a failed copy re-enables the `build` job rather than aborting the deploy.
  # See the gate on `build` for the mechanics.
  resolve:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.deploy_backend) && needs.discover.outputs.should_build_backend == 'true' }}
    needs: discover
    runs-on: ubuntu-latest
    outputs:
      reuse: ${{ steps.decide.outputs.reuse }}
      pr_head_sha12: ${{ steps.decide.outputs.pr_head_sha12 }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Resolve-Reuse
          aws-region: ${{ needs.discover.outputs.aws_region }}

      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.sha }}
          MATRIX_JSON: ${{ needs.discover.outputs.build_matrix }}
          BUCKET: ${{ needs.discover.outputs.s3_bucket }}
          APP_NAME: ${{ needs.discover.outputs.app_name }}
        run: |
          set -uo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          gh_get() { curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
                       -H 'Accept: application/vnd.github+json' "$1"; }
          decide() {
            echo "reuse=$1"  >> "$GITHUB_OUTPUT"
            echo "reason=$2" >> "$GITHUB_OUTPUT"
            echo "DECISION: reuse=$1 reason=$2"
          }

          # 1. Which PR introduced this merge commit? A direct push to main has
          #    no PR and therefore no prebuilt images — build, do not fail.
          HEAD_SHA="$(gh_get "${API}/commits/${MERGE_SHA}/pulls" \
            | jq -r 'if type=="array" then (.[0].head.sha // "") else "" end')"
          if [[ -z "${HEAD_SHA}" || "${HEAD_SHA}" == "null" ]]; then
            decide false no-pr; exit 0
          fi
          HEAD12="${HEAD_SHA:0:12}"
          echo "PR head: ${HEAD_SHA}"

          # 2. Is the merged tree the tree the image was actually built from?
          #    This is the real safety condition, and it is why we do NOT branch
          #    on merge strategy: a merge commit or a rebase that pulled in new
          #    main commits produces a tree the PR never built or tested, so the
          #    prebuilt image would be silently stale. Comparing tree SHAs is
          #    strategy-independent and exact. (Using the API rather than git
          #    also avoids needing fetch-depth: 0 on the checkout.)
          MERGE_TREE="$(gh_get "${API}/commits/${MERGE_SHA}" | jq -r '.commit.tree.sha')"
          HEAD_TREE="$(gh_get "${API}/commits/${HEAD_SHA}"  | jq -r '.commit.tree.sha')"
          echo "merge tree=${MERGE_TREE}  head tree=${HEAD_TREE}"
          if [[ "${MERGE_TREE}" != "${HEAD_TREE}" ]]; then
            decide false tree-mismatch; exit 0
          fi

          # 3. Every service THIS deploy intends to ship must have a tarball.
          #    The matrix is path-filtered, so a worker-only deploy legitimately
          #    needs only the worker: a fully-present subset is a correct reuse,
          #    not a partial. But a MISSING member forces a full rebuild — we
          #    never reuse some services and rebuild others.
          MISSING=""
          for svc in $(jq -r '.[].name' <<<"${MATRIX_JSON}"); do
            KEY="deployments/${APP_NAME}-pr/${HEAD12}/${svc}.tar.gz"
            if aws s3 ls "s3://${BUCKET}/${KEY}" >/dev/null 2>&1; then
              echo "present: ${KEY}"
            else
              echo "MISSING: ${KEY}"
              MISSING="${MISSING} ${svc}"
            fi
          done
          if [[ -n "${MISSING// }" ]]; then
            decide false "missing:${MISSING# }"; exit 0
          fi

          echo "pr_head_sha12=${HEAD12}" >> "$GITHUB_OUTPUT"
          decide true hit

  build:
    # Skipped on a reuse hit, but only once the copy has actually SUCCEEDED —
    # this job is the fallback that makes good on "reuse is never a hard
    # dependency". `resolve` decides; `reuse` executes; a failure in EITHER
    # lands here and builds normally.
    #
    # `!cancelled()` is mandatory, not stylistic: on a reuse MISS the `reuse`
    # job is skipped, and a skipped dependency skips its dependents by default,
    # which would kill the very build the miss path depends on.
    #
    # The failure this catches is not hypothetical. Besides IAM drift, the PR
    # image prefix carries a 30-day lifecycle rule, so a tarball can expire
    # between `resolve`'s `s3 ls` existence check and this copy — a TOCTOU that
    # would otherwise hard-abort a deploy for no good reason.
    if: >-
      !cancelled()
      && (github.event_name != 'workflow_dispatch' || inputs.deploy_backend)
      && needs.discover.outputs.should_build_backend == 'true'
      && (needs.resolve.outputs.reuse != 'true' || needs.reuse.result == 'failure')
    needs: [discover, resolve, reuse]
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        shell: bash
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - id: load_config
        shell: bash
        run: |
          set -euo pipefail
          chmod +x infra/scripts/deploy/load-infra-app-config.sh
          infra/scripts/deploy/load-infra-app-config.sh "infra.app.config.json" > /tmp/infra.env
          set -a
          source /tmp/infra.env
          set +a

          {
            echo "APP_NAME=$APP_NAME"
            echo "AWS_REGION=$AWS_REGION"
            echo "S3_BUCKET=$S3_BUCKET"
            echo "DOCKER_NODE_VERSION=$DOCKER_NODE_VERSION"
          } >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Build-${{ matrix.service.name }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for ARM64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          target: runtime-node
          build-args: |
            SERVICE_NAME=${{ matrix.service.name }}
          tags: |
            ${{ env.APP_NAME }}-${{ matrix.service.name }}:${{ env.SHORT_SHA }}
          load: true
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          provenance: false

      - name: Save image tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          docker save "${APP_NAME}-${{ matrix.service.name }}:${SHORT_SHA}" | gzip > "out/${{ matrix.service.name }}.tar.gz"
          gzip -t "out/${{ matrix.service.name }}.tar.gz"
          ls -lh "out/${{ matrix.service.name }}.tar.gz"

      - name: Upload image tarball to S3
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp \
            "out/${{ matrix.service.name }}.tar.gz" \
            "s3://${S3_BUCKET}/deployments/${APP_NAME}/${SHORT_SHA}/${{ matrix.service.name }}.tar.gz" \
            --region "${AWS_REGION}"

  # Reuse hit: promote the PR-built tarballs into this deploy's prefix so the
  # rest of the pipeline is byte-identical to a freshly-built deploy. This is a
  # server-side S3 copy — no ~144MiB round-trip through the runner — which is
  # what makes the hit path cheap.
  reuse:
    if: ${{ needs.resolve.outputs.reuse == 'true' }}
    needs: [discover, resolve]
    runs-on: ubuntu-latest
    steps:
      - name: Set short SHA
        shell: bash
        run: echo "SHORT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Reuse-Images
          aws-region: ${{ needs.discover.outputs.aws_region }}

      - name: Copy PR images into this deploy's prefix
        shell: bash
        env:
          BUCKET: ${{ needs.discover.outputs.s3_bucket }}
          APP_NAME: ${{ needs.discover.outputs.app_name }}
          HEAD12: ${{ needs.resolve.outputs.pr_head_sha12 }}
          MATRIX_JSON: ${{ needs.discover.outputs.build_matrix }}
          AWS_REGION: ${{ needs.discover.outputs.aws_region }}
        run: |
          set -euo pipefail
          for svc in $(jq -r '.[].name' <<<"${MATRIX_JSON}"); do
            SRC="s3://${BUCKET}/deployments/${APP_NAME}-pr/${HEAD12}/${svc}.tar.gz"
            DST="s3://${BUCKET}/deployments/${APP_NAME}/${SHORT_SHA}/${svc}.tar.gz"
            echo "copy ${SRC} -> ${DST}"
            aws s3 cp "${SRC}" "${DST}" --region "${AWS_REGION}"
          done

  deploy:
    # `!cancelled()` + result checks, not a plain needs-gate: on a reuse hit the
    # `build` job is SKIPPED, and a skipped dependency would otherwise skip this
    # job too. A skipped build is a success condition here; only a FAILED build
    # must stop the deploy.
    #
    # Deliberately NOT gated on `needs.reuse.result != 'failure'` any more: a
    # failed copy is now a fallback trigger, not a deploy-stopper — `build`
    # picks it up and produces the images itself. Re-adding that clause would
    # silently disable the fallback, since the deploy it feeds could never run.
    if: >-
      !cancelled()
      && (github.event_name != 'workflow_dispatch' || inputs.deploy_backend)
      && needs.discover.outputs.should_deploy_backend == 'true'
      && needs.build.result != 'failure'
    needs:
      - discover
      - resolve
      - build
      - reuse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        shell: bash
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v5
        with:
          name: generated-worker-compose
          path: artifacts/generated-worker-compose

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Deploy-Backend
          aws-region: ${{ needs.discover.outputs.aws_region }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Prepare deploy payload
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p deploy-payload/compose
          cp infra/config/docker-compose/base.yml deploy-payload/compose/base.yml
          cp infra/config/docker-compose/prod.yml deploy-payload/compose/prod.yml
          cp artifacts/generated-worker-compose/workers.generated.yml deploy-payload/compose/workers.generated.yml

      - name: Upload deploy payload to S3
        shell: bash
        run: |
          set -euo pipefail

          aws s3 cp deploy-payload/ \
            "s3://${{ needs.discover.outputs.s3_bucket }}/deployments/${{ needs.discover.outputs.app_name }}/${SHORT_SHA}/" \
            --recursive \
            --region "${{ needs.discover.outputs.aws_region }}"

      - name: Run remote backend deploy via SSM
        shell: bash
        run: |
          set -euo pipefail
          chmod +x infra/scripts/deploy/ssm-run.sh

          export AWS_REGION="${{ needs.discover.outputs.aws_region }}"
          export S3_BUCKET="${{ needs.discover.outputs.s3_bucket }}"
          export APP_NAME="${{ needs.discover.outputs.app_name }}"
          export ENV="${{ needs.discover.outputs.env_name }}"
          # Pin the Docker Compose project to the original name so deploys reuse the
          # existing prod stack (volume/containers/network) instead of orphaning them
          # under a new ${APP_NAME}-${ENV} project. APP_NAME/branding stay 'homeroll';
          # only the on-host stack namespace stays 'betaname-prod'.
          export COMPOSE_PROJECT_NAME="betaname-${ENV}"
          export SHA="${SHORT_SHA}"
          # On a reuse, the loaded image carries the PR head SHA as its tag
          # while every consumer (workers.generated.yml, the API_IMAGE pin)
          # expects the merge SHA. remote-deploy.sh retags using this. Empty on
          # a normal build, where the tags already match.
          #
          # Keyed on the reuse OUTCOME (`reuse.result == 'success'`), NEVER on
          # the reuse DECISION (`resolve.outputs.reuse`). The two diverge on
          # exactly one path — the fallback — where `resolve` still says
          # reuse=true but the image was rebuilt and carries the merge SHA. Key
          # this on the decision and remote-deploy.sh would try to retag from a
          # PR-head tag that was never loaded on the host; `docker tag` exits
          # non-zero under `set -euo pipefail`, so the SSM step aborts and the
          # deploy fails — after paying for the full rebuild. That is loud, not
          # silent, but it still defeats the fallback: the copy failure just
          # moves downstream instead of being absorbed.
          export IMAGE_SOURCE_TAG="${{ needs.reuse.result == 'success' && needs.resolve.outputs.pr_head_sha12 || '' }}"
          export DEPLOY_BACKEND=true
          export DEPLOY_FRONTEND=false
          export CHANGED_SERVICE_NAMES="${{ needs.discover.outputs.changed_service_names }}"
          export GITHUB_SHA="${{ github.sha }}"
          export GITHUB_RUN_ID="${{ github.run_id }}"
          export GITHUB_RUN_ATTEMPT="${{ github.run_attempt }}"

          source infra/scripts/deploy/ssm-run.sh
          ssm_run "Deploy backend ${APP_NAME} ${SHA}" "infra/scripts/remote/remote-deploy.sh"

  deploy_frontend:
    needs: [discover, build, deploy]
    if: >-
      !cancelled()
      && (github.event_name != 'workflow_dispatch' || inputs.deploy_frontend)
      && needs.discover.outputs.frontend_changed == 'true'
      && needs.build.result != 'failure'
      && needs.deploy.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        shell: bash
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - id: load_config
        shell: bash
        run: |
          set -euo pipefail
          chmod +x infra/scripts/deploy/load-infra-app-config.sh
          infra/scripts/deploy/load-infra-app-config.sh "infra.app.config.json" > /tmp/infra.env
          set -a
          source /tmp/infra.env
          set +a

          {
            echo "APP_NAME=$APP_NAME"
            echo "ENV_NAME=$ENV_NAME"
            echo "AWS_REGION=$AWS_REGION"
            echo "S3_BUCKET=$S3_BUCKET"
          } >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install proper npm
        run: npm i -g npm@11.6.2  
      
      - name: npm -v
        run: |
          node -v
          npm -v
          which npm
      
      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:web
        env:
          VITE_API: /api

      - name: Package frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          tar -czf out/frontend.tar.gz -C apps/web/dist .

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Deploy-Frontend
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload frontend tarball to S3
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp \
            out/frontend.tar.gz \
            "s3://${S3_BUCKET}/deployments/${APP_NAME}/${SHORT_SHA}/frontend.tar.gz" \
            --region "${AWS_REGION}"

      - name: Upload shared Caddyfile to S3
        shell: bash
        run: |
          set -euo pipefail
          if [ -f infra/config/caddy/Caddyfile.shared ]; then
            aws s3 cp infra/config/caddy/Caddyfile.shared \
              "s3://${S3_BUCKET}/deployments/shared/Caddyfile" \
              --region "${AWS_REGION}"
          fi

          if [ -f Caddyfile ]; then
            aws s3 cp Caddyfile \
              "s3://${S3_BUCKET}/deployments/${APP_NAME}/${SHORT_SHA}/Caddyfile" \
              --region "${AWS_REGION}"
          fi

      - name: Deploy shared Caddyfile to EC2 (SSM)
        shell: bash
        run: |
          set -euo pipefail
          chmod +x infra/scripts/deploy/ssm-run.sh

          export AWS_REGION="${AWS_REGION}"
          export S3_BUCKET="${S3_BUCKET}"
          export APP_NAME="${APP_NAME}"
          export ENV="${ENV_NAME}"
          export SHA="${SHORT_SHA}"
          export DEPLOY_BACKEND=false
          export DEPLOY_FRONTEND=false
          export GITHUB_SHA="${{ github.sha }}"
          export GITHUB_RUN_ID="${{ github.run_id }}"
          export GITHUB_RUN_ATTEMPT="${{ github.run_attempt }}"

          source infra/scripts/deploy/ssm-run.sh
          ssm_run "Deploy shared Caddyfile" "infra/scripts/remote/deploy-shared-caddyfile.sh"

      - name: Run remote frontend deploy via SSM
        shell: bash
        run: |
          set -euo pipefail
          chmod +x infra/scripts/deploy/ssm-run.sh

          export AWS_REGION="${AWS_REGION}"
          export S3_BUCKET="${S3_BUCKET}"
          export APP_NAME="${APP_NAME}"
          export ENV="${ENV_NAME}"
          export SHA="${SHORT_SHA}"
          export DEPLOY_BACKEND=false
          export DEPLOY_FRONTEND=true
          export GITHUB_SHA="${{ github.sha }}"
          export GITHUB_RUN_ID="${{ github.run_id }}"
          export GITHUB_RUN_ATTEMPT="${{ github.run_attempt }}"

          source infra/scripts/deploy/ssm-run.sh
          ssm_run "Deploy frontend ${APP_NAME} ${SHA}" "infra/scripts/remote/remote-deploy.sh"