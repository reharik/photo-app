# Local dev stack. Flat — replaces the former base.yml + infra dev.yml +
# docker-compose.dev.yml chain.
#
# Run from the repo root (the Makefile does). Relative env_file/volume paths
# resolve against this file's directory, which is now the repo root, so no
# --project-directory is needed.
#
# PER-CLONE PORTS: a second working copy sets DEV_DB_PORT / DEV_API_PORT /
# DEV_LOCALSTACK_PORT in its git-ignored Makefile.local, rather than layering a
# port-remap override file on top. Defaults below reproduce the primary clone.
# Keep localstack on 4566 unless you know better — packages/e2e/fixtures/
# localstackSes.ts hardcodes localhost:4566 for host-run e2e.
services:
  localstack:
    image: localstack/localstack:4.13
    ports:
      - "${DEV_LOCALSTACK_PORT:-4566}:4566"
      - "4510-4559:4510-4559"
    environment:
      - SERVICES=ses,sns,s3
      - DEFAULT_REGION=${AWS_REGION:-us-east-1}
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      # Init hook: re-verifies the SES sender identity on every boot (state is
      # ephemeral and `make docker/dev/down` wipes the data volume).
      - ./infra/config/localstack/init/ready.d:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    # Off 5432 so this stack doesn't collide with another local Postgres.
    ports:
      - "${DEV_DB_PORT:-5433}:5432"
    env_file:
      - ./apps/api/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot migration runner; api/media-worker gate on its clean exit, so
  # nothing serves against an unmigrated database. `restart` MUST stay "no" —
  # a one-shot that restarts after exiting 0 loops forever.
  #
  # Unlike prod, this runs the SOURCE entrypoint under tsx: the dev image is
  # source + tsx with no dist/ to run.
  migrate:
    image: ${API_IMAGE:-homeroll-api:dev}
    restart: "no"
    working_dir: /app/apps/api
    command: ["npx", "tsx", "src/scripts/runMigrations.ts"]
    env_file:
      - ./apps/api/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${API_IMAGE:-homeroll-api:dev}
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: dev
      args:
        APP_NAME: api
    ports:
      - "${DEV_API_PORT:-3001}:3001"
    env_file:
      - ./apps/api/.env
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3000}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      API_PORT: "3001"
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
      # Must match the identity verified in
      # infra/config/localstack/init/ready.d/verify-ses.sh — LocalStack SES
      # rejects any unverified Source, and the api sends verification codes
      # inline, so a mismatch here silently breaks the signup/reset doors.
      FROM_EMAIL: invites@homeroll.app
      FROM_NAME: Homeroll Dev
    volumes:
      - ./apps/api:/app/apps/api
      - /app/apps/api/node_modules
      - ./packages:/app/packages
    command: ["sh", "-c", "sh apps/api/src/scripts/serverStartUpDev.sh"]
    depends_on:
      localstack:
        condition: service_healthy
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  media-worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: dev
      args:
        APP_NAME: media-worker
    env_file:
      - ./apps/media-worker/.env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # SES -> LocalStack; S3 -> real AWS via the ~/.aws mount below.
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      FROM_EMAIL: invites@homeroll.app
      FROM_NAME: Homeroll Dev
      # for e2e testing
      SLOW_SWEEP_INTERVAL_MS: 5000
      FAST_SWEEP_INTERVAL_MS: 5000
      DEBOUNCE_EMAIL_WINDOW_SECONDS: 5
      # Idle-poll interval; only bites for the first job after the queue
      # drains (the loop re-claims back-to-back while work exists).
      MEDIA_WORKER_POLL_MS: 2500
    volumes:
      - ./apps/media-worker:/app/apps/media-worker
      - /app/apps/media-worker/node_modules
      - ./packages:/app/packages
      - ~/.aws:/root/.aws:ro
    command:
      ["sh", "-c", "sh apps/media-worker/src/scripts/serverStartUpDev.sh"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ses-viewer:
    build: https://github.com/veertech/localstack-aws-ses-email-viewer.git#main
    environment:
      LOCALSTACK_HOST: http://localstack:4566
      SMTP_FORWARD_ENABLED: "true"
      SMTP_FORWARD_HOST: mailpit
      SMTP_FORWARD_PORT: "1025"
    ports:
      - "3005:3005"
    depends_on:
      - localstack
      - mailpit

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
    ports:
      - "8025:8025" # UI
      - "1025:1025" # SMTP

volumes:
  pgdata:
  localstack_data:
