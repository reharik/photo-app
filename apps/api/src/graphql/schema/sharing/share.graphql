type AuthorizationType {
  id: ID!
  grantedToUserId: ID
  operations: [Operation!]!
  label: String
  expiresAt: DateTime
  revokedAt: DateTime
  createdAt: DateTime!
}

type ShareContactType {
  userId: ID
  handle: String!
}

type GrantUserAuthorizationResult {
  data: GrantUserAuthorizationPayload
  errors: [ContractError!]
}

type GrantUserAuthorizationPayload {
  succeeded: [GrantUserAuthorizationSucceeded!]!
  failed: [GrantUserAuthorizationFailed!]!
}

type GrantUserAuthorizationSucceeded {
  email: String!
}

type GrantUserAuthorizationFailed {
  email: String!
  error: ContractError!
}

type GrantMediaItemUserAuthorizationResult {
  data: GrantMediaItemUserAuthorizationPayload
  errors: [ContractError!]
}

type GrantMediaItemUserAuthorizationPayload {
  userIds: [ID!]!
}
