type Album implements ViewableItem & Node {
  id: ID!
  title: String!
  coverMedia: MediaItem
  albumMembers(input: AlbumMemberInput!): AlbumMemberCollectionPayload!
  createdAt: DateTime!
  updatedAt: DateTime!
  owner: Owner
  ownerFirstName: String
  ownerLastName: String
  items(input: ViewerAlbumItemsInput!): AlbumItemCollectionPayload!
  comments(input: CommentsInput!): CommentCollectionPayload!
  resolveShareRecipients(emails: [String!]!): ResolveShareRecipientsResponse!
  operations: [Operation!]!
  itemCount: Int!
  emailShares: [EmailShare!]!
  publicLink: PublicLink
}

type ResolveShareRecipientsResponse {
  data: [ShareRecipient!]
  errors: [ContractError!]
}

type EmailShare {
  id: ID!
  email: String!
  displayName: String
  hasAccount: Boolean!
  userId: ID
  createdAt: DateTime!
}

type PublicLink {
  token: String
}

type Owner {
  firstName: String
  lastName: String
}

input AlbumMemberInput {
  collectionInfo: AlbumMemberCollectionInput!
}

input AlbumMemberCollectionInput {
  pageInfo: PageInfoInput!
  sortBy: AlbumMemberSortBy!
  sortDir: SortDir!
}

type AlbumMemberCollectionPayload {
  nodes: [AlbumMember!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

input ViewerAlbumItemsInput {
  collectionInfo: AlbumItemCollectionInput!
}

input AlbumItemCollectionInput {
  pageInfo: PageInfoInput!
  sortBy: AlbumItemSortBy!
  sortDir: SortDir!
}

type AlbumItemCollectionPayload {
  nodes: [AlbumItem!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

type AlbumMember implements Node {
  id: ID!
  userId: ID!
  role: AlbumMemberRole!
  firstName: String!
  lastName: String!
  email: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum AlbumMemberRole {
  OWNER
  CONTRIBUTOR
  ADMIN
}

enum AlbumMemberSortBy {
  ROLE
    @enumMeta(
      props: [
        { name: "column", value: "role" }
        { name: "table", value: "album_member" }
        { name: "nullsLast", value: "true" }
      ]
    )
}

type AlbumItem implements ViewableItem & Node {
  id: ID!
  mediaItem: MediaItem!
  operations: [Operation!]!
  orderIndex: String!
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum AlbumItemSortBy {
  TAKEN_AT
    @enumMeta(
      props: [
        { name: "column", value: "taken_at" }
        { name: "table", value: "media_item" }
        { name: "nullsLast", value: "true" }
      ]
    )
  CREATED_AT
    @enumMeta(
      props: [
        { name: "column", value: "created_at" }
        { name: "table", value: "album_item" }
        { name: "nullsLast", value: "false" }
      ]
    )
  ORDER_INDEX
    @enumMeta(
      props: [
        { name: "column", value: "order_index" }
        { name: "table", value: "album_item" }
        { name: "nullsLast", value: "false" }
      ]
    )
}

type ShareRecipient {
  email: String!
  resolved: Boolean!
  displayName: String
}
