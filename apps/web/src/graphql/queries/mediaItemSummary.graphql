fragment MediaItemSummary on MediaItem {
  id
  kind
  status
  title
  mimeType
  width
  height
  durationMs
  originalFileName
  createdAt
  description
  takenAt
  takenAtUtcOffsetMinutes
  reactionCounts {
    ...ReactionCounts
  }
  viewerReactions {
    ...ViewerReaction
  }
  ...ViewableMediaItem
}
