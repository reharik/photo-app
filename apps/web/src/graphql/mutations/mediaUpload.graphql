mutation CreateMediaUpload($input: [CreateMediaUploadInput!]!) {
  createMediaUpload(input: $input) {
    data {
      # Selected explicitly: codegen runs with `skipTypename: true`, so without this the
      # generated union has no discriminant and the two branches are indistinguishable.
      __typename
      ... on CreateMediaUploadPayload {
        clientId
        mediaItemId
        status
        uploadInstructions {
          method
          url
          headers {
            key
            value
          }
        }
      }
      ... on CreateMediaUploadItemError {
        clientId
        error {
          ...errorsFragment
        }
      }
    }
    errors {
      ...errorsFragment
    }
  }
}

mutation FinalizeMediaUpload($input: FinalizeMediaUploadInput!) {
  finalizeMediaUpload(input: $input) {
    data {
      mediaItemId
      status
      size
      kind
    }
    errors {
      ...errorsFragment
    }
  }
}
